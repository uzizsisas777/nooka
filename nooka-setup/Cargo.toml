[package]
name = "nooka_setup"
version = "1.0.0"
edition = "2021"
authors = ["Nooka"]

[dependencies]
winapi = { version = "0.3", features = ["winbase", "winuser", "wincon", "processthreadsapi", "handleapi", "fileapi", "synchapi", "errhandlingapi", "winerror", "libloaderapi", "wingdi", "shellscalingapi", "windef", "shlobj", "shellapi", "commdlg", "combaseapi", "objidl", "shobjidl_core", "guiddef"] }
widestring = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "nooka_setup"
path = "src/main.rs"
