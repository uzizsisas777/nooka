[package]
name = "nooka_launcher"
version = "1.0.0"
edition = "2021"
authors = ["Nooka Launcher"]

[dependencies]
winapi = { version = "0.3", features = ["winbase", "winuser", "wincon", "processthreadsapi", "handleapi", "fileapi", "synchapi", "errhandlingapi", "winerror", "libloaderapi", "wingdi", "shellscalingapi", "windef"] }
semver = "1.0"
widestring = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "nooka_launcher"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winbase", "winuser", "wincon", "processthreadsapi", "handleapi", "fileapi", "synchapi", "errhandlingapi", "winerror", "libloaderapi", "wingdi", "shellscalingapi", "windef"] }
