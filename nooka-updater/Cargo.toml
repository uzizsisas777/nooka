[package]
name = "nooka_updater"
version = "1.0.0"
edition = "2021"
authors = ["Nooka Updater"]

[dependencies]
winapi = { version = "0.3", features = ["winbase", "winuser", "wincon", "wingdi", "processthreadsapi", "handleapi", "fileapi", "synchapi", "errhandlingapi", "winerror", "libloaderapi", "combaseapi", "objidl", "shobjidl_core", "guiddef"] }
semver = "1.0"
widestring = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
